name: Publish gate - denylist check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  denylist-check:
    runs-on: ubuntu-latest
    name: Check for confidential content

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run denylist grep
        run: bash scripts/sanitize-template.sh --check-only

      - name: Summary
        if: always()
        run: echo "Denylist check complete."
